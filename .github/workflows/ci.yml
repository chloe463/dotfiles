name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      brewfile: ${{ steps.filter.outputs.brewfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            brewfile:
              - 'Brewfile.shared'

  test-brew-install:
    needs: detect-changes
    if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.brewfile == 'true'
    name: brew install
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # The runner image ships the Go `yq`, which conflicts with `python-yq`
      # from Brewfile.shared (both install a `yq` executable).
      - name: Unlink preinstalled yq
        run: |
          if brew list --formula yq > /dev/null 2>&1; then
            brew unlink yq
          fi
      - name: Test setup scripts
        run: ./up brew
  test-sheldon:
    name: Install sheldon plugins
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install sheldon
        run: brew install sheldon
      - name: Test setup scripts
        run: |
          # Copy plugins.toml to the expected location (stow is not run in CI)
          mkdir -p ~/.config/sheldon
          cp zsh/.config/sheldon/plugins.toml ~/.config/sheldon/plugins.toml
          # Unset insteadOf to allow sheldon to clone plugins via HTTPS
          # (insteadOf redirects https://github.com/ to SSH, which has no key in CI)
          if git config --global --get 'url.ssh://git@github.com/.insteadOf' > /dev/null 2>&1; then
            git config --global --unset 'url.ssh://git@github.com/.insteadOf'
          fi
          ./up sheldon
      - name: Verify sheldon source is valid zsh syntax
        run: sheldon source | zsh -n
  test-dots-syms:
    name: Make symlinks
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install stow
        run: brew install stow
      - name: Test setup scripts
        run: |
          # Run against a pristine HOME so stow has no conflicts with the
          # runner's pre-existing dotfiles (e.g. ~/.config/gh), and so the job
          # actually exercises symlink creation instead of short-circuiting on
          # a missing stow. Only $HOME itself is created here: `up` owns the
          # creation of every stow target, and pre-creating them in CI hid the
          # missing-target abort that breaks a machine without VS Code/Cursor.
          export HOME="$RUNNER_TEMP/stow-home"
          mkdir -p "$HOME"
          ./up stow
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun typecheck
  # Runs every *.test.ts: the statusline and the Claude Code hook scripts
  test-bun:
    name: Test TypeScript scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run test
        run: bun test
  test-runok-rules:
    name: Test runok rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # The Claude Code integration this config relies on (`runok hook`,
      # `defaults.action: pass`) isn't released yet, so build main like
      # `brew "fohte/tap/runok", args: ["HEAD"]` does. Testing against the
      # latest main also surfaces upstream changes that break the rules.
      - name: Resolve runok revision
        id: runok
        run: echo "sha=$(git ls-remote https://github.com/fohte/runok.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache runok
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/runok
          key: runok-${{ runner.os }}-${{ steps.runok.outputs.sha }}
      - name: Install runok
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          RUNOK_SHA: ${{ steps.runok.outputs.sha }}
        run: cargo install --locked --git https://github.com/fohte/runok.git --rev "$RUNOK_SHA"
      - name: Run rule tests
        run: runok test -c runok/.config/runok/runok.yml
